name: Bug Report
description: Report a reproducible problem with the app or Worker.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the issue and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include recording mode, pause length, audio/camera settings, and upload state if relevant.
      placeholder: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.6"
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: "2.0"
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove secrets and private recording links before sharing.
