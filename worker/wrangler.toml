name = "screencast"
main = "src/worker.ts"
compatibility_date = "2026-09-11"
compatibility_flags = ["nodejs_compat"]

[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = true

# Bind the Worker to the current Cloudflare-fronted domains.
#
# GitHub Pages is configured for the static marketing/privacy site, but the
# apex domain still resolves through Cloudflare today. Keep screencast.to here
# until DNS is moved to GitHub Pages, otherwise a Worker deploy removes the
# live apex trigger and the public site returns Cloudflare 530.
# Prerequisites:
#   1. screencast.to is added as a zone in your Cloudflare account
#   2. Cloudflare is set as the authoritative nameservers for it
# Until both are true, comment this block out and the Worker stays reachable
# at https://screencast.<your-subdomain>.workers.dev.
routes = [
  { pattern = "screencast.to", custom_domain = true },
  { pattern = "share.screencast.to", custom_domain = true },
]

# The canonical service accepts only StoreKit-derived short-lived tokens.
# A private fork may deliberately change this to "self-hosted" and configure
# SELF_HOSTED_UPLOAD_TOKEN after replacing the Worker name and routes.
[vars]
UPLOAD_AUTH_MODE = "app-store"

# Per-IP rate limit on /sign (10 requests / 60s).
# `namespace_id` is an arbitrary unique integer per limiter in your account.
[[unsafe.bindings]]
name = "SIGN_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Required secrets (set via `./deploy.sh`):
#   R2_ACCOUNT_ID         — your Cloudflare account ID
#   R2_BUCKET             — bucket name
#   R2_ACCESS_KEY_ID      — R2 API token access key
#   R2_SECRET_ACCESS_KEY  — R2 API token secret
#   R2_PUB_HOST           — production R2 custom-domain host, e.g. "media.screencast.to"
#   APP_APPLE_ID          — numeric App Store app ID from App Store Connect
#   SERVICE_TOKEN_SECRET  — random secret used only to sign 15-minute tokens
#   SELF_HOSTED_UPLOAD_TOKEN — private forks only; canonical deploy refuses it
#   MAX_UPLOAD_BYTES      — optional declared upload-size limit; defaults to 1 GiB
